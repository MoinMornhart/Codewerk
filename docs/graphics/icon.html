<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 512px; height: 512px; background: transparent; overflow: hidden; }
  .icon {
    position: absolute; inset: 24px; border-radius: 112px; display: grid; place-items: center;
    background: linear-gradient(135deg, #7aa2ff 0%, #8a3ffc 100%);
    box-shadow: inset 0 -20px 44px rgba(0, 0, 0, 0.18), inset 0 12px 30px rgba(255, 255, 255, 0.22);
  }
  .glyph {
    font: 800 188px/1 "Cascadia Code", "Cascadia Mono", Consolas, monospace; color: #fff;
    letter-spacing: -16px; transform: translate(-8px, -4px);
    text-shadow: 0 10px 26px rgba(20, 10, 60, 0.35);
  }
</style>
</head>
<body>
  <div class="icon"><div class="glyph">&lt;/&gt;</div></div>
</body>
</html>
